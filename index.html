<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YanNaing - AI Tools Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #090d16;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #0f172a;
            border-bottom: 1px solid #1e293b;
        }
        .logo {
            font-weight: bold;
            font-size: 20px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }
        .logo span { color: #38bdf8; }
        .container {
            padding: 20px 15px;
            max-width: 500px;
            margin: 0 auto;
        }
        .promo-banner {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #334155;
            margin-bottom: 20px;
        }
        .promo-tag {
            background-color: #f59e0b;
            color: #000;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 8px;
        }
        .card {
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .api-box {
            background-color: #1e293b;
            border: 1px dashed #38bdf8;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 20px;
        }
        .api-box label {
            font-size: 12px;
            color: #38bdf8;
            font-weight: bold;
        }
        .tabs {
            display: flex;
            background-color: #0f172a;
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 15px;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            color: #94a3b8;
            border-radius: 6px;
            cursor: pointer;
        }
        .tab.active {
            background-color: #2563eb;
            color: #ffffff;
        }
        label {
            font-size: 13px;
            color: #cbd5e1;
            display: block;
            margin-bottom: 6px;
        }
        input[type="text"], input[type="password"], textarea, select {
            width: 100%;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            color: #ffffff;
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 15px;
            outline: none;
        }
        input:focus, textarea:focus, select:focus {
            border-color: #38bdf8;
        }
        textarea {
            height: 100px;
            resize: vertical;
        }
        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary:hover {
            opacity: 0.9;
        }
        .tools-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }
        .tool-card {
            background-color: #111827;
            border: 1px solid #1f2937;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            color: #e2e8f0;
            cursor: pointer;
        }
        .audio-player {
            margin-top: 15px;
            width: 100%;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ YAN<span>NAING</span></div>
        <div style="cursor:pointer;">☰</div>
    </header>

    <div class="container">
        <div class="promo-banner">
            <div class="promo-tag">PROMO</div>
            <div style="font-size: 14px; font-weight: bold;">Unlock Unlimited Voice & Features</div>
            <div style="font-size: 12px; color: #94a3b8; margin-top: 4px;">Contact via Facebook, Telegram for Premium Plan.</div>
        </div>

        <div class="card">
            <div class="api-box">
                <label for="apiKey">🔑 Gemini API Key ထည့်ပါ (OWN KEY):</label>
                <input type="password" id="apiKey" placeholder="Paste your Gemini API key here..." style="margin-bottom: 0; margin-top: 6px;">
            </div>

            <h2 style="font-size: 18px; color: #38bdf8; margin-top: 0; text-align: center;">AI Voice Generator</h2>

            <div class="tabs">
                <div class="tab active">SINGLE</div>
                <div class="tab">MULTI</div>
            </div>

            <label>File Name</label>
            <input type="text" id="fileName" value="KC_Voice">

            <label>Text to Speech (ဖတ်ပြရမည့် စာသား)</label>
            <textarea id="textInput" placeholder="ဒီမှာ အင်္ဂလိပ် သို့မဟုတ် မြန်မာစာသား ရိုက်ထည့်ပါ..."></textarea>

            <label>Character / Voice Style</label>
            <select id="voiceSelect">
                <option value="en-US-Standard-C">မောင်မိုင်း (Male - Natural)</option>
                <option value="en-US-Standard-F">သူတ (Female - Clear)</option>
                <option value="en-US-Standard-D">သန့်စင် (Male - Deep)</option>
                <option value="en-US-Standard-E">ကြည်လင် (Female - Soft)</option>
            </select>

            <button class="btn-primary" onclick="generateVoice()">Generate Voice</button>

            <audio id="audioPlayer" class="audio-player" controls></audio>
        </div>

        <h3 style="font-size: 15px; color: #64748b; margin-top: 25px;">AVAILABLE TOOLS</h3>
        <div class="tools-grid">
            <div class="tool-card" onclick="alert('AI Voice Tool ကို လက်ရှိ သုံးစွဲနေပါသည်။')">🎙️ AI Voice</div>
            <div class="tool-card" onclick="alert('Transcribe Feature မကြာမီ လာမည်!')">📝 Transcribe</div>
            <div class="tool-card" onclick="alert('Translate Feature မကြာမီ လာမည်!')">🌐 Translate</div>
            <div class="tool-card" onclick="alert('SRT Generator Feature မကြာမီ လာမည်!')">🎬 SRT Generator</div>
        </div>
    </div>

    <script>
        async function generateVoice() {
            const apiKey = document.getElementById("apiKey").value.trim();
            const text = document.getElementById("textInput").value.trim();
            const voice = document.getElementById("voiceSelect").value;
            const audioPlayer = document.getElementById("audioPlayer");

            if (!text) {
                alert("ကျေးဇူးပြု၍ ဖတ်ပြရမည့် စာသား ရိုက်ထည့်ပါ!");
                return;
            }

            // If API key is provided, try calling Google Text-to-Speech API
            if (apiKey) {
                try {
                    const response = await fetch(`https://texttospeech.googleapis.com/v1/text:synthesize?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            input: { text: text },
                            voice: { languageCode: 'en-US', name: voice },
                            audioConfig: { audioEncoding: 'MP3' }
                        })
                    });

                    const data = await response.json();
                    if (data.audioContent) {
                        audioPlayer.src = "data:audio/mp3;base64," + data.audioContent;
                        audioPlayer.style.display = "block";
                        audioPlayer.play();
                        return;
                    } else {
                        alert("API Key မမှန်ကန်ပါ သို့မဟုတ် Error ရှိနေပါသည်။ Browser Voice ဖြင့် ဖတ်ပြပေးပါမည်။");
                    }
                } catch (err) {
                    console.log("API Error, fallback to Web Speech API");
                }
            }

            // Fallback to Free Browser Speech Synthesis if API key is not provided or fails
            window.speechSynthesis.cancel();
            const speech = new SpeechSynthesisUtterance(text);
            speech.rate = 1;
            window.speechSynthesis.speak(speech);
        }
    </script>

</body>
</html>
