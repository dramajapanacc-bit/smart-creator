<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YanNaing - AI Tools</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #060913;
            color: #ffffff;
            margin: 0;
            padding: 0;
            padding-bottom: 30px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #0d121f;
            border-bottom: 1px solid #1a233a;
        }
        .logo {
            font-weight: 800;
            font-size: 18px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }
        .logo span { color: #38bdf8; }
        .container {
            padding: 15px;
            max-width: 480px;
            margin: 0 auto;
        }
        
        /* Banner */
        .promo-banner {
            background: linear-gradient(135deg, #11192e, #0a0f1d);
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid #1f2d4d;
            margin-bottom: 20px;
        }
        .promo-tag {
            background-color: #d97706;
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 6px;
        }

        /* Card Section */
        .card {
            background-color: #0d1322;
            border: 1px solid #1a253d;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            margin-bottom: 20px;
        }

        /* API Engine Selection (System / Own Key) */
        .engine-box {
            background-color: #080d19;
            border: 1px solid #1a253d;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 20px;
        }
        .engine-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .engine-title {
            font-size: 12px;
            font-weight: bold;
            color: #94a3b8;
        }
        .engine-toggle {
            display: flex;
            background-color: #111827;
            border-radius: 8px;
            padding: 3px;
        }
        .engine-btn {
            padding: 6px 12px;
            font-size: 11px;
            font-weight: bold;
            border: none;
            background: none;
            color: #64748b;
            border-radius: 6px;
            cursor: pointer;
        }
        .engine-btn.active {
            background-color: #2563eb;
            color: #ffffff;
        }
        .key-input-wrap {
            display: none;
            margin-top: 10px;
        }
        
        /* Voice Engine Tabs */
        .voice-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .voice-tab-btn {
            padding: 12px;
            background-color: #111827;
            border: 1px solid #1f293d;
            border-radius: 10px;
            color: #94a3b8;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            text-align: center;
        }
        .voice-tab-btn.active {
            border-color: #2563eb;
            color: #60a5fa;
            background-color: #132038;
        }

        /* Mode Tabs (SINGLE / MULTI) */
        .mode-tabs {
            display: flex;
            background-color: #080d19;
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 15px;
        }
        .mode-tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            color: #64748b;
            border-radius: 8px;
            cursor: pointer;
        }
        .mode-tab.active {
            background-color: #2563eb;
            color: #ffffff;
        }

        /* Form Controls */
        label {
            font-size: 12px;
            color: #94a3b8;
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }
        input[type="text"], input[type="password"], textarea, select {
            width: 100%;
            background-color: #080d19;
            border: 1px solid #1e293b;
            border-radius: 10px;
            padding: 12px;
            color: #ffffff;
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 15px;
            outline: none;
        }
        input:focus, textarea:focus, select:focus {
            border-color: #2563eb;
        }
        textarea {
            height: 110px;
            resize: vertical;
        }

        /* Primary Button */
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37,99,235,0.3);
        }

        /* Tools Grid */
        .tools-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
        }
        .tool-card {
            background-color: #0d1322;
            border: 1px solid #1a253d;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            color: #e2e8f0;
            cursor: pointer;
        }
        .audio-player {
            margin-top: 15px;
            width: 100%;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ YAN<span>NAING</span></div>
        <div style="cursor:pointer; color:#94a3b8;">☰</div>
    </header>

    <div class="container">
        <div class="promo-banner">
            <div class="promo-tag">PROMO</div>
            <div style="font-size: 13px; font-weight: bold;">Unlock Unlimited Voice & Features</div>
            <div style="font-size: 11px; color: #94a3b8; margin-top: 3px;">Contact via Facebook, Telegram for Premium Plan.</div>
        </div>

        <div class="engine-box">
            <div class="engine-header">
                <span class="engine-title">API ENGINE:</span>
                <div class="engine-toggle">
                    <button class="engine-btn active" id="btnSystem" onclick="setEngine('system')">SYSTEM</button>
                    <button class="engine-btn" id="btnOwnKey" onclick="setEngine('own')">OWN KEY</button>
                </div>
            </div>
            <div class="key-input-wrap" id="keyWrap">
                <input type="password" id="apiKey" placeholder="Paste your Gemini API Key here..." style="margin-bottom:0;">
            </div>
        </div>

        <div class="card">
            <div style="text-align:center; margin-bottom: 15px;">
                <h2 style="font-size: 18px; margin:0; color:#ffffff;">AI Voice Generator</h2>
            </div>

            <div class="voice-tabs">
                <div class="voice-tab-btn active" id="tabKc" onclick="selectVoiceTab('kc')">KC VOICE</div>
                <div class="voice-tab-btn" id="tabGemini" onclick="selectVoiceTab('gemini')">GEMINI VOICE</div>
            </div>

            <div class="mode-tabs">
                <div class="mode-tab active">SINGLE</div>
                <div class="mode-tab">MULTI</div>
            </div>

            <label>File Name</label>
            <input type="text" id="fileName" value="KC_Voice">

            <label>Text to Speech</label>
            <textarea id="textInput" placeholder="Enter text for Voice..."></textarea>

            <label>Character</label>
            <select id="voiceSelect">
                <option value="my-MM">မောင်မိုင်း (Myanmar)</option>
                <option value="my-MM-2">သူတ (Myanmar)</option>
                <option value="my-MM-3">သန့်စင် (Myanmar)</option>
                <option value="my-MM-4">ကြည်လင် (Myanmar)</option>
                <option value="en-US">John (English)</option>
                <option value="en-US-F">Monica (English)</option>
            </select>

            <label>Style</label>
            <select>
                <option>Recap</option>
                <option>Normal</option>
            </select>

            <button class="btn-submit" onclick="generateVoice()">Generate</button>

            <audio id="audioPlayer" class="audio-player" controls></audio>
        </div>

        <h3 style="font-size: 13px; color: #64748b; margin-top: 25px; font-weight: bold; letter-spacing: 0.5px;">AVAILABLE TOOLS</h3>
        <div class="tools-grid">
            <div class="tool-card" onclick="alert('AI Voice Tool ကို အသုံးပြုနေပါသည်။')">🎙️ AI Voice</div>
            <div class="tool-card" onclick="alert('Transcribe Feature မကြာမီ ရပါမည်။')">📝 Transcribe</div>
            <div class="tool-card" onclick="alert('Translate Feature မကြာမီ ရပါမည်။')">🌐 Translate</div>
            <div class="tool-card" onclick="alert('SRT Generator Feature မကြာမီ ရပါမည်။')">🎬 SRT Generator</div>
        </div>
    </div>

    <script>
        let currentEngine = 'system';

        function setEngine(type) {
            currentEngine = type;
            const btnSystem = document.getElementById('btnSystem');
            const btnOwnKey = document.getElementById('btnOwnKey');
            const keyWrap = document.getElementById('keyWrap');

            if (type === 'own') {
                btnOwnKey.classList.add('active');
                btnSystem.classList.remove('active');
                keyWrap.style.display = 'block';
            } else {
                btnSystem.classList.add('active');
                btnOwnKey.classList.remove('active');
                keyWrap.style.display = 'none';
            }
        }

        function selectVoiceTab(tab) {
            document.getElementById('tabKc').classList.toggle('active', tab === 'kc');
            document.getElementById('tabGemini').classList.toggle('active', tab === 'gemini');
        }

        async function generateVoice() {
            const text = document.getElementById("textInput").value.trim();
            const apiKey = document.getElementById("apiKey").value.trim();
            const audioPlayer = document.getElementById("audioPlayer");

            if (!text) {
                alert("ကျေးဇူးပြု၍ စာသား ရိုက်ထည့်ပေးပါ!");
                return;
            }

            if (currentEngine === 'own' && !apiKey) {
                alert("ကျေးဇူးပြု၍ Gemini API Key ထည့်သွင်းပေးပါ!");
                return;
            }

            // Speech Synthesis (Browser Standard Voice)
            window.speechSynthesis.cancel();
            const speech = new SpeechSynthesisUtterance(text);
            speech.rate = 1;
            window.speechSynthesis.speak(speech);
            
            alert("အသံထွက် ဖတ်ပြနေပါပြီ...");
        }
    </script>

</body>
</html>
