<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YanNaing. AI Script</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #0f172a); 
            color: #fff; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container { 
            max-width: 600px; 
            width: 100%; 
            background: rgba(30, 41, 59, 0.9); 
            backdrop-filter: blur(12px);
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-sizing: border-box; 
        }
        h2 { 
            color: #38bdf8; 
            text-align: center; 
            margin-bottom: 5px;
            font-size: 26px;
        }
        .subtitle {
            font-size: 13px; 
            color: #cbd5e1; 
            text-align: center; 
            margin-bottom: 25px;
        }
        label { 
            display: block; 
            margin: 15px 0 8px; 
            font-weight: 600;
            color: #e2e8f0;
            font-size: 14px;
        }
        input { 
            width: 100%; 
            padding: 14px; 
            border-radius: 10px; 
            border: 1px solid #475569; 
            background: #0f172a; 
            color: #fff; 
            font-size: 15px;
            box-sizing: border-box; 
            transition: all 0.3s ease;
        }
        input:focus {
            border-color: #38bdf8;
            outline: none;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
        }
        button { 
            width: 100%; 
            padding: 14px; 
            border-radius: 10px; 
            background: linear-gradient(135deg, #0284c7, #2563eb); 
            color: white;
            font-weight: bold; 
            font-size: 16px;
            margin-top: 20px; 
            cursor: pointer; 
            border: none; 
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }
        button:hover { 
            background: linear-gradient(135deg, #0369a1, #1d4ed8);
            transform: translateY(-2px);
        }
        .result-box { 
            margin-top: 20px; 
            background: #0f172a; 
            padding: 18px; 
            border-radius: 10px; 
            border: 1px solid #38bdf8; 
            min-height: 150px; 
            max-height: 350px;
            overflow-y: auto;
            white-space: pre-wrap; 
            word-break: break-word; 
            color: #f1f5f9;
            line-height: 1.6;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>✨ YanNaing. AI Script</h2>
    <div class="subtitle">🎬 YouTube / TikTok လင့်ခ် သို့မဟုတ် ရုပ်ရှင်နာမည်ထည့်၍ Script ထုတ်ပါ</div>
    
    <label>အချက်အလက် (Link သို့မဟုတ် Movie Name):</label>
    <input type="text" id="videoLink" placeholder="ဥပမာ - Avatar 2 သို့မဟုတ် ဗီဒီယိုလင့်ခ်ထည့်ရန်">

    <button onclick="generateFromLink()">✨ Script ထုတ်မည်</button>

    <label>AI ရေးသားပေးသော မြန်မာ Script:</label>
    <div id="result" class="result-box">ဒီနေရာတွင် AI ရေးသားထားသော Script များ ပေါ်လာပါမည်...</div>
</div>

<script>
async function generateFromLink() {
    const linkInput = document.getElementById('videoLink').value.trim();
    const resultDiv = document.getElementById('result');

    if (!linkInput) {
        alert("ကျေးဇူးပြု၍ လင့်ခ် သို့မဟုတ် ရုပ်ရှင်နာမည် ထည့်ပါ");
        return;
    }

    resultDiv.innerText = "⏳ AI က ဇာတ်လမ်းကို လေ့လာပြီး Script ရေးနေပါပြီ။ ခဏစောင့်ပါ...";
    
    try {
        const response = await fetch('/api/recap-video', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ videoUrl: linkInput })
        });

        const data = await response.json();
        if (data.script) {
            resultDiv.innerText = data.script;
        } else {
            resultDiv.innerText = "အမှားအယွင်း: " + (data.error || "Script မထွက်ပါ။");
        }
    } catch (err) {
        resultDiv.innerText = "Server ချိတ်ဆက်မှု အဆင်မပြေပါ။";
    }
}
</script>

</body>
</html>
