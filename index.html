<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YNT Movie Recap AI</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:"Segoe UI",Tahoma,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 20% 0%,rgba(59,130,246,.25),transparent 35%),
    radial-gradient(circle at 90% 20%,rgba(168,85,247,.22),transparent 35%),
    linear-gradient(135deg,#050816,#0b1020,#111827);
}

.container{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:20px;
}

.header{
  text-align:center;
  padding:25px 10px 30px;
}

.logo{
  font-size:32px;
  font-weight:900;
  background:linear-gradient(
    90deg,
    #38bdf8,
    #818cf8,
    #c084fc,
    #f472b6
  );
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.subtitle{
  margin-top:8px;
  color:#94a3b8;
  font-size:14px;
}

.card{
  padding:24px;
  border-radius:26px;
  background:rgba(15,23,42,.72);
  border:1px solid rgba(255,255,255,.10);
  box-shadow:
    0 25px 70px rgba(0,0,0,.45),
    inset 0 1px rgba(255,255,255,.05);
  backdrop-filter:blur(18px);
}

.step{
  display:flex;
  align-items:center;
  gap:13px;
  margin-bottom:22px;
}

.step-number{
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  border-radius:14px;
  background:linear-gradient(135deg,#2563eb,#9333ea);
  font-weight:900;
  font-size:18px;
  box-shadow:0 8px 25px rgba(99,102,241,.25);
}

.step-title{
  font-size:20px;
  font-weight:900;
}

.step-sub{
  margin-top:4px;
  color:#94a3b8;
  font-size:12px;
}

.upload{
  position:relative;
  display:block;
  padding:45px 20px;
  border-radius:22px;
  border:2px dashed rgba(96,165,250,.65);
  background:
    radial-gradient(circle at center,rgba(59,130,246,.14),transparent 65%),
    rgba(30,41,59,.45);
  text-align:center;
  cursor:pointer;
  transition:.25s;
}

.upload:hover{
  border-color:#38bdf8;
  transform:translateY(-2px);
  background:
    radial-gradient(circle at center,rgba(59,130,246,.20),transparent 65%),
    rgba(30,41,59,.6);
}

.upload.dragover{
  border-color:#c084fc;
  transform:scale(1.01);
}

.upload-icon{
  font-size:52px;
  margin-bottom:12px;
}

.upload-title{
  font-size:19px;
  font-weight:900;
}

.upload-text{
  margin-top:7px;
  color:#94a3b8;
  font-size:13px;
}

.upload input{
  display:none;
}

.file-info{
  display:none;
  margin-top:16px;
  padding:16px;
  border-radius:18px;
  background:rgba(30,41,59,.75);
  border:1px solid rgba(148,163,184,.15);
}

.file-name{
  color:#38bdf8;
  font-size:14px;
  font-weight:800;
  word-break:break-word;
}

.file-meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
}

.meta{
  padding:7px 10px;
  border-radius:9px;
  background:#111827;
  color:#cbd5e1;
  font-size:12px;
}

.video-preview{
  display:none;
  width:100%;
  max-height:480px;
  margin-top:16px;
  border-radius:20px;
  background:#000;
  border:1px solid rgba(255,255,255,.08);
}

.clear-btn{
  width:100%;
  margin-top:12px;
  padding:13px;
  border:1px solid #475569;
  border-radius:13px;
  background:#172033;
  color:#cbd5e1;
  font-weight:800;
  cursor:pointer;
}

.clear-btn:hover{
  border-color:#ef4444;
  color:#fca5a5;
}

.ready{
  display:none;
  margin-top:16px;
  padding:13px;
  border-radius:13px;
  text-align:center;
  color:#86efac;
  background:rgba(34,197,94,.08);
  border:1px solid rgba(34,197,94,.20);
  font-size:13px;
  font-weight:800;
}

.next-btn{
  width:100%;
  margin-top:20px;
  padding:17px;
  border:0;
  border-radius:16px;
  color:#fff;
  font-size:16px;
  font-weight:900;
  background:linear-gradient(135deg,#2563eb,#9333ea);
  cursor:pointer;
  box-shadow:0 10px 30px rgba(59,130,246,.25);
}

.next-btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.status{
  min-height:22px;
  margin-top:13px;
  text-align:center;
  color:#94a3b8;
  font-size:13px;
}

.footer{
  padding:25px 0;
  text-align:center;
  color:#475569;
  font-size:12px;
}

@media(max-width:600px){

  .container{
    padding:10px;
  }

  .card{
    padding:17px;
    border-radius:21px;
  }

  .logo{
    font-size:26px;
  }

  .upload{
    padding:38px 15px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">
      🎬 YNT MOVIE RECAP AI
    </div>

    <div class="subtitle">
      AI-Powered Myanmar Movie Recap Studio
    </div>
  </div>


  <!-- STEP 1 -->

  <div class="card">

    <div class="step">

      <div class="step-number">
        1
      </div>

      <div>

        <div class="step-title">
          🎬 Movie Upload
        </div>

        <div class="step-sub">
          Recap လုပ်မယ့် Movie / Video ဖိုင်ကို ရွေးပါ
        </div>

      </div>

    </div>


    <label
      class="upload"
      id="uploadBox"
    >

      <div class="upload-icon">
        🎞️
      </div>

      <div class="upload-title">
        Movie / Video ရွေးရန်
      </div>

      <div class="upload-text">
        MP4 • MOV • WEBM • AVI
      </div>

      <input
        type="file"
        id="videoInput"
        accept="video/*"
      >

    </label>


    <!-- FILE INFORMATION -->

    <div
      class="file-info"
      id="fileInfo"
    >

      <div
        class="file-name"
        id="fileName"
      ></div>

      <div class="file-meta">

        <div
          class="meta"
          id="fileSize"
        >
          📦 —
        </div>

        <div
          class="meta"
          id="fileType"
        >
          🎞️ —
        </div>

        <div
          class="meta"
          id="fileDuration"
        >
          ⏱️ —
        </div>

      </div>

    </div>


    <!-- VIDEO PREVIEW -->

    <video
      id="videoPreview"
      class="video-preview"
      controls
      playsinline
      preload="metadata"
    ></video>


    <button
      id="clearBtn"
      class="clear-btn"
      type="button"
      style="display:none;"
    >
      🗑️ Video ဖယ်မည်
    </button>


    <div
      id="ready"
      class="ready"
    >
      ✅ Movie Upload အောင်မြင်ပါပြီ
    </div>


    <button
      id="nextBtn"
      class="next-btn"
      type="button"
      disabled
    >
      🤖 Step 2 — AI Movie Analysis
    </button>


    <div
      id="status"
      class="status"
    ></div>

  </div>


  <div class="footer">
    © 2026 YNT Movie Recap AI
  </div>

</div>


<script>

let previewURL = null;


/* =====================================
   ELEMENTS
===================================== */

const videoInput =
  document.getElementById("videoInput");

const uploadBox =
  document.getElementById("uploadBox");

const fileInfo =
  document.getElementById("fileInfo");

const fileName =
  document.getElementById("fileName");

const fileSize =
  document.getElementById("fileSize");

const fileType =
  document.getElementById("fileType");

const fileDuration =
  document.getElementById("fileDuration");

const videoPreview =
  document.getElementById("videoPreview");

const clearBtn =
  document.getElementById("clearBtn");

const ready =
  document.getElementById("ready");

const nextBtn =
  document.getElementById("nextBtn");

const status =
  document.getElementById("status");


/* =====================================
   FORMAT FILE SIZE
===================================== */

function formatSize(bytes){

  if(bytes < 1024){
    return bytes + " B";
  }

  if(bytes < 1024 * 1024){

    return (
      bytes / 1024
    ).toFixed(1) + " KB";

  }

  if(bytes < 1024 * 1024 * 1024){

    return (
      bytes / 1024 / 1024
    ).toFixed(2) + " MB";

  }

  return (
    bytes / 1024 / 1024 / 1024
  ).toFixed(2) + " GB";
}


/* =====================================
   FORMAT DURATION
===================================== */

function formatDuration(seconds){

  if(!Number.isFinite(seconds)){
    return "—";
  }

  seconds =
    Math.floor(seconds);

  const hours =
    Math.floor(seconds / 3600);

  const minutes =
    Math.floor(
      (seconds % 3600) / 60
    );

  const secs =
    seconds % 60;

  if(hours > 0){

    return (
      String(hours).padStart(2,"0") +
      ":" +
      String(minutes).padStart(2,"0") +
      ":" +
      String(secs).padStart(2,"0")
    );

  }

  return (
    String(minutes).padStart(2,"0") +
    ":" +
    String(secs).padStart(2,"0")
  );
}


/* =====================================
   SHOW VIDEO
===================================== */

function loadVideo(file){

  if(!file){
    return;
  }


  if(!file.type.startsWith("video/")){

    status.textContent =
      "❌ Video ဖိုင်သာ ရွေးပါ။";

    videoInput.value = "";

    return;
  }


  /*
   * OLD PREVIEW URL CLEAN
   */

  if(previewURL){

    URL.revokeObjectURL(
      previewURL
    );
  }


  previewURL =
    URL.createObjectURL(file);


  /*
   * FILE INFO
   */

  fileName.textContent =
    "🎬 " + file.name;

  fileSize.textContent =
    "📦 " + formatSize(file.size);

  fileType.textContent =
    "🎞️ " +
    (
      file.type ||
      "video"
    );


  fileInfo.style.display =
    "block";


  /*
   * VIDEO PREVIEW
   */

  videoPreview.src =
    previewURL;

  videoPreview.style.display =
    "block";

  videoPreview.load();


  /*
   * RESET
   */

  ready.style.display =
    "none";

  nextBtn.disabled =
    true;

  status.textContent =
    "⏳ Video information ဖတ်နေပါတယ်...";


  /*
   * DURATION
   */

  videoPreview.onloadedmetadata =
    function(){

      fileDuration.textContent =
        "⏱️ " +
        formatDuration(
          videoPreview.duration
        );

      ready.style.display =
        "block";

      clearBtn.style.display =
        "block";

      nextBtn.disabled =
        false;

      status.textContent =
        "✅ Video ကို အောင်မြင်စွာ ရွေးပြီးပါပြီ။";

    };


  videoPreview.onerror =
    function(){

      status.textContent =
        "⚠️ Video Preview ဖတ်မရပါ။ ဖိုင် format ကို စစ်ပါ။";

    };
}


/* =====================================
   FILE SELECT
===================================== */

videoInput.addEventListener(
  "change",
  function(){

    const file =
      this.files[0];

    if(!file){
      return;
    }

    loadVideo(file);

  }
);


/* =====================================
   DRAG & DROP
===================================== */

uploadBox.addEventListener(
  "dragover",
  function(event){

    event.preventDefault();

    uploadBox.classList.add(
      "dragover"
    );

  }
);


uploadBox.addEventListener(
  "dragleave",
  function(){

    uploadBox.classList.remove(
      "dragover"
    );

  }
);


uploadBox.addEventListener(
  "drop",
  function(event){

    event.preventDefault();

    uploadBox.classList.remove(
      "dragover"
    );

    const file =
      event.dataTransfer.files[0];

    if(!file){
      return;
    }

    if(
      !file.type.startsWith(
        "video/"
      )
    ){

      status.textContent =
        "❌ Video ဖိုင်သာ ထည့်ပါ။";

      return;
    }


    /*
     * Put dropped file into input
     * when browser allows it.
     */

    try{

      const dataTransfer =
        new DataTransfer();

      dataTransfer.items.add(
        file
      );

      videoInput.files =
        dataTransfer.files;

    }catch(error){

      console.log(
        "DataTransfer:",
        error
      );

    }


    loadVideo(file);

  }
);


/* =====================================
   CLEAR VIDEO
===================================== */

clearBtn.addEventListener(
  "click",
  function(){

    if(previewURL){

      URL.revokeObjectURL(
        previewURL
      );

      previewURL =
        null;
    }


    videoInput.value = "";

    videoPreview.pause();

    videoPreview.removeAttribute(
      "src"
    );

    videoPreview.load();

    videoPreview.style.display =
      "none";

    fileInfo.style.display =
      "none";

    clearBtn.style.display =
      "none";

    ready.style.display =
      "none";

    nextBtn.disabled =
      true;

    status.textContent =
      "Video ဖယ်ရှားပြီးပါပြီ။";

  }
);


/* =====================================
   STEP 2 BUTTON
===================================== */

nextBtn.addEventListener(
  "click",
  function(){

    const file =
      videoInput.files[0];

    if(!file){

      status.textContent =
        "⚠️ အရင် Movie / Video ရွေးပါ။";

      return;
    }


    /*
     * STEP 1 ONLY
     *
     * Step 2 ကို နောက်အဆင့်မှာ
     * ချိတ်မယ်။
     */

    status.textContent =
      "✅ Step 1 ပြီးပါပြီ။ Step 2 AI Movie Analysis အတွက် အသင့်ဖြစ်ပါပြီ။";

  }
);

</script>

</body>
</html>
