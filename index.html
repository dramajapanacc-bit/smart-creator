<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YanNaing - AI Tools Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #121826;
            border-bottom: 1px solid #1f293d;
        }
        .logo {
            font-weight: bold;
            font-size: 20px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }
        .logo span { color: #38bdf8; }
        .promo-banner {
            background: linear-gradient(135deg, #1f293d, #111827);
            margin: 15px;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #374151;
            position: relative;
        }
        .promo-tag {
            background-color: #f59e0b;
            color: #000;
            font-size: 11px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 8px;
        }
        .container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }
        .card {
            background-color: #161e2e;
            border: 1px solid #2d3748;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        h2 {
            font-size: 20px;
            color: #38bdf8;
            text-align: center;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #9ca3af;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .tabs {
            display: flex;
            background-color: #0f172a;
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 15px;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            color: #9ca3af;
            border-radius: 6px;
            cursor: pointer;
        }
        .tab.active {
            background-color: #2563eb;
            color: #ffffff;
        }
        label {
            font-size: 13px;
            color: #d1d5db;
            display: block;
            margin-bottom: 5px;
        }
        input[type="text"], textarea, select {
            width: 100%;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            color: #ffffff;
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        textarea {
            height: 100px;
            resize: vertical;
        }
        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .tools-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }
        .tool-card {
            background-color: #161e2e;
            border: 1px solid #2d3748;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            color: #e2e8f0;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ YAN<span>NAING</span></div>
        <div>☰</div>
    </header>

    <div class="container">
        <div class="promo-banner">
            <div class="promo-tag">PROMO</div>
            <div style="font-size: 14px; font-weight: bold;">Unlock Unlimited Voice & Features</div>
            <div style="font-size: 12px; color: #9ca3af; margin-top: 4px;">Contact via Facebook, Telegram for Premium Plan.</div>
        </div>

        <div class="card">
            <h2>AI Voice Generator</h2>
            <p class="subtitle">ဖုန်းဖြင့် ဖန်တီးထားသော အလှပဆုံး ဝဘ်ဆိုက်</p>

            <div class="tabs">
                <div class="tab active">SINGLE</div>
                <div class="tab">MULTI</div>
            </div>

            <label>File Name</label>
            <input type="text" value="KC_Voice">

            <label>Text to Speech</label>
            <textarea placeholder="ဒီမှာ စာရိုက်ပါ..."></textarea>

            <label>Character</label>
            <select>
                <option>မောင်မိုင်း (Myanmar)</option>
                <option>သူတ (Myanmar)</option>
                <option>သန့်စင် (Myanmar)</option>
                <option>ကြည်လင် (Myanmar)</option>
            </select>

            <label>Style</label>
            <select>
                <option>Recap</option>
                <option>Normal</option>
            </select>

            <button class="btn-primary" onclick="alert('ဖန်တီးနေပါပြီ...')">Generate</button>
        </div>

        <h3 style="font-size: 16px; color: #94a3b8; margin-top: 25px;">AVAILABLE TOOLS</h3>
        <div class="tools-grid">
            <div class="tool-card">🎙️ AI Voice</div>
            <div class="tool-card">📝 Transcribe</div>
            <div class="tool-card">🌐 Translate</div>
            <div class="tool-card">🎬 SRT Generator</div>
        </div>
    </div>

</body>
</html>
