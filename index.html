<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YanNaing - AI Tools</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #060913;
            color: #ffffff;
            margin: 0;
            padding: 0;
            padding-bottom: 30px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #0d121f;
            border-bottom: 1px solid #1a233a;
        }
        .logo {
            font-weight: 800;
            font-size: 18px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }
        .logo span { color: #38bdf8; }
        .container {
            padding: 15px;
            max-width: 480px;
            margin: 0 auto;
        }
        .promo-banner {
            background: linear-gradient(135deg, #11192e, #0a0f1d);
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid #1f2d4d;
            margin-bottom: 20px;
        }
        .promo-tag {
            background-color: #d97706;
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 6px;
        }
        .card {
            background-color: #0d1322;
            border: 1px solid #1a253d;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            margin-bottom: 20px;
        }
        .engine-box {
            background-color: #080d19;
            border: 1px solid #1a253d;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 20px;
        }
        .engine-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .engine-title {
            font-size: 12px;
            font-weight: bold;
            color: #94a3b8;
        }
        .engine-toggle {
            display: flex;
            background-color: #111827;
            border-radius: 8px;
            padding: 3px;
        }
        .engine-btn {
            padding: 6px 12px;
            font-size: 11px;
            font-weight: bold;
            border: none;
            background: none;
            color: #64748b;
            border-radius: 6px;
            cursor: pointer;
        }
        .engine-btn.active {
            background-color: #2563eb;
            color: #ffffff;
        }
        .key-input-wrap {
            display: none;
            margin-top: 10px;
        }
        .voice-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .voice-tab-btn {
            padding: 12px;
            background-color: #111827;
            border: 1px solid #1f293d;
            border-radius: 10px;
            color: #94a3b8;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            text-align: center;
        }
        .voice-tab-btn.active {
            border-color: #2563eb;
            color: #60a5fa;
            background-color: #132038;
        }
        .mode-tabs {
            display: flex;
            background-color: #080d19;
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 15px;
        }
        .mode-tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            color: #64748b;
            border-radius: 8px;
            cursor: pointer;
        }
        .mode-tab.active {
            background-color: #2563eb;
            color: #ffffff;
        }
        label {
            font-size: 12px;
            color: #94a3b8;
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }
        input[type="text"], input[type="password"], textarea, select {
            width: 100%;
            background-color: #080d19;
            border: 1px solid #1e293b;
            border-radius: 10px;
            padding: 12px;
            color: #ffffff;
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 15px;
            outline: none;
        }
        input:focus, textarea:focus, select:focus {
            border-color: #2563eb;
        }
        textarea {
            height: 110px;
            resize: vertical;
        }
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37,99,235,0.3);
        }
        .tools-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
        }
        .tool-card {
            background-color: #0d1322;
            border: 1px solid #1a253d;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            color: #e2e8f0;
            cursor: pointer;
        }
        .audio-player {
            margin-top: 15px;
            width: 100%;
            display: none;
        }
        #statusText {
            margin-top: 10px;
            font-size: 12px;
            color: #38bdf8;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ YAN<span>NAING</span></div>
        <div style="cursor:pointer; color:#94a3b8;">☰</div>
    </header>

    <div class="container">
        <div class="promo-banner">
            <div class="promo-tag">PROMO</div>
            <div style="font-size: 13px; font-weight: bold;">Unlock Unlimited Voice & Features</div>
            <div style="font-size: 11px; color: #94a3b8; margin-top: 3px;">Contact via Facebook, Telegram for Premium Plan.</div>
        </div>

        <div class="engine-box">
            <div class="engine-header">
                <span class="engine-title">API ENGINE:</span>
                <div class="engine-toggle">
                    <button class="engine-btn active" id="btnSystem" onclick="setEngine('system')">SYSTEM</button>
                    <button class="engine-btn" id="btnOwnKey" onclick="setEngine('own')">OWN KEY</button>
                </div>
            </div>
            <div class="key-input-wrap" id="keyWrap">
                <input type="password" id="apiKey" placeholder="Paste Gemini / Google API Key here..." style="margin-bottom:0;">
            </div>
        </div>

        <div class="card">
            <div style="text-align:center; margin-bottom: 15px;">
                <h2 style="font-size: 18px; margin:0; color:#ffffff;">AI Voice Generator</h2>
            </div>

            <div class="voice-tabs">
                <div class="voice-tab-btn active" id="tabKc" onclick="selectVoiceTab('kc')">KC VOICE</div>
                <div class="voice-tab-btn" id="tabGemini" onclick="selectVoiceTab('gemini')">GEMINI VOICE</div>
            </div>

            <div class="mode-tabs">
                <div class="mode-tab active">SINGLE</div>
                <div class="mode-tab">MULTI</div>
            </div>

            <label>File Name</label>
            <input type="text" id="fileName" value="KC_Voice">

            <label>Text to Speech</label>
            <textarea id="textInput" placeholder="အသံထွက်ပြောင်းချင်သော စာသားရိုက်ထည့်ပါ..."></textarea>

            <label>Character / Voice Language</label>
            <select id="voiceSelect">
                <option value="en-US">English Male (John)</option>
                <option value="en-US-Female">English Female (Jenny)</option>
                <option value="my-MM">Myanmar Voice</option>
            </select>

            <label>Style</label>
            <select>
                <option>Recap</option>
                <option>Normal</option>
            </select>

            <button class="btn-submit" id="genBtn" onclick="generateVoice()">Generate Voice</button>
            <div id="statusText"></div>

            <audio id="audioPlayer" class="audio-player" controls></audio>
        </div>

        <h3 style="font-size: 13px; color: #64748b; margin-top: 25px; font-weight: bold;">AVAILABLE TOOLS</h3>
        <div class="tools-grid">
            <div class="tool-card">🎙️ AI Voice</div>
            <div class="tool-card">📝 Transcribe</div>
            <div class="tool-card">🌐 Translate</div>
            <div class="tool-card">🎬 SRT Generator</div>
        </div>
    </div>

    <script>
        let currentEngine = 'system';

        function setEngine(type) {
            currentEngine = type;
            const btnSystem = document.getElementById('btnSystem');
            const btnOwnKey = document.getElementById('btnOwnKey');
            const keyWrap = document.getElementById('keyWrap');

            if (type === 'own') {
                btnOwnKey.classList.add('active');
                btnSystem.classList.remove('active');
                keyWrap.style.display = 'block';
            } else {
                btnSystem.classList.add('active');
                btnOwnKey.classList.remove('active');
                keyWrap.style.display = 'none';
            }
        }

        function selectVoiceTab(tab) {
            document.getElementById('tabKc').classList.toggle('active', tab === 'kc');
            document.getElementById('tabGemini').classList.toggle('active', tab === 'gemini');
        }

        async function generateVoice() {
            const text = document.getElementById("textInput").value.trim();
            const apiKey = document.getElementById("apiKey").value.trim();
            const voiceLang = document.getElementById("voiceSelect").value;
            const statusText = document.getElementById("statusText");
            const audioPlayer = document.getElementById("audioPlayer");

            if (!text) {
                alert("ကျေးဇူးပြု၍ စာသား ရိုက်ထည့်ပေးပါ!");
                return;
            }

            if (currentEngine === 'own' && !apiKey) {
                alert("ကျေးဇူးပြု၍ OWN KEY ကို ရွေးထားပါက Gemini / Google API Key ထည့်သွင်းပေးပါ!");
                return;
            }

            statusText.innerText = "အသံဖိုင် ဖန်တီးနေပါသည်... စောင့်ဆိုင်းပေးပါ...";

            // API Key ထည့်ထားပါက Google Text-to-Speech တိုက်ရိုက်ခေါ်မည်
            if (currentEngine === 'own' && apiKey) {
                try {
                    const response = await fetch(`https://texttospeech.googleapis.com/v1/text:synthesize?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            input: { text: text },
                            voice: { languageCode: 'en-US', ssmlGender: 'NEUTRAL' },
                            audioConfig: { audioEncoding: 'MP3' }
                        })
                    });
                    const data = await response.json();
                    if (data.audioContent) {
                        audioPlayer.src = "data:audio/mp3;base64," + data.audioContent;
                        audioPlayer.style.display = "block";
                        audioPlayer.play();
                        statusText.innerText = "အသံဖိုင် ဖန်တီးပြီးပါပြီ!";
                        return;
                    } else {
                        statusText.innerText = "API Key အမှားအယွင်းရှိပါသည်။ သာမန် Voice ဖြင့် ထွက်ပေးပါမည်။";
                    }
                } catch (e) {
                    console.log(e);
                }
            }

            // Free Online Google Voice API Fallback (Key မလိုဘဲ တိုက်ရိုက် အသံထွက်ပေးမည့် စနစ်)
            const cleanText = encodeURIComponent(text);
            const freeAudioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${cleanText}&tl=${voiceLang.split('-')[0]}&client=tw-ob`;
            
            audioPlayer.src = freeAudioUrl;
            audioPlayer.style.display = "block";
            audioPlayer.play().then(() => {
                statusText.innerText = "အသံဖိုင် ထွက်နေပါပြီ!";
            }).catch(() => {
                // Fallback Speech Synthesis
                window.speechSynthesis.cancel();
                const speech = new SpeechSynthesisUtterance(text);
                window.speechSynthesis.speak(speech);
                statusText.innerText = "အသံထွက် ဖတ်ပြနေပါသည်။";
            });
        }
    </script>

</body>
</html>
