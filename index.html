<script>
    let selectedVoice = 'Zephyr';
    let audioBlobUrl = null;

    const textInput    = document.getElementById('textInput');
    const generateBtn  = document.getElementById('generateBtn');
    const statusDiv    = document.getElementById('status');
    const audioPlayer  = document.getElementById('audioPlayer');
    const downloadBtn  = document.getElementById('downloadBtn');
    const voiceDisplay = document.getElementById('selectedVoiceDisplay');
    const voiceGrid    = document.getElementById('voiceGrid');

    // Voice Selection
    voiceGrid.addEventListener('click', (e) => {
        const btn = e.target.closest('.voice-btn');
        if (!btn) return;
        document.querySelectorAll('.voice-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedVoice = btn.dataset.voice;
        voiceDisplay.textContent = selectedVoice;
    });

    // Generate TTS
    async function generateTTS() {
        const text = textInput.value.trim();
        if (!text) {
            alert('ကျေးဇူးပြု၍ စာသားထည့်ပါ။');
            return;
        }

        generateBtn.disabled = true;
        generateBtn.textContent = '⏳ ပြင်ဆင်နေသည်...';
        statusDiv.textContent = '⏳ ' + selectedVoice + ' အသံထုတ်နေပါသည်...';
        audioPlayer.style.display = 'none';
        downloadBtn.style.display = 'none';

        try {
            const response = await fetch('/api/tts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            });

            if (!response.ok) {
                const err = await response.json();
                throw new Error(err.error || 'အသံထုတ်မရပါ။');
            }

            const blob = await response.blob();
            if (!blob || blob.size === 0) {
                throw new Error('အသံဖိုင်အလွတ်ဖြစ်နေသည်။');
            }

            if (audioBlobUrl) {
                URL.revokeObjectURL(audioBlobUrl);
                audioBlobUrl = null;
            }

            audioBlobUrl = URL.createObjectURL(blob);
            audioPlayer.src = audioBlobUrl;
            audioPlayer.style.display = 'block';
            audioPlayer.load();

            downloadBtn.style.display = 'block';
            statusDiv.textContent = '✅ ' + selectedVoice + ' အသံရပါပြီ။';

        } catch (err) {
            console.error('TTS Error:', err);
            statusDiv.textContent = '❌ ' + err.message;
        } finally {
            generateBtn.disabled = false;
            generateBtn.textContent = '🔊 အသံထုတ်မည်';
        }
    }

    function downloadAudio() {
        if (!audioBlobUrl) return;
        const a = document.createElement('a');
        a.href = audioBlobUrl;
        a.download = 'yan-naing-voice-' + selectedVoice + '.mp3';
        document.body.appendChild(a);
        a.click();
        a.remove();
    }

    generateBtn.addEventListener('click', generateTTS);
    downloadBtn.addEventListener('click', downloadAudio);

    textInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            generateTTS();
        }
    });

    audioPlayer.addEventListener('loadeddata', () => {
        audioPlayer.play().catch(() => {});
    });

    console.log('✅ မြန်မာ TTS အဆင်သင့်ဖြစ်ပါပြီ။');
</script>
