<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video to Movie Recap Script</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #fff; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 600px; width: 100%; background: #1e293b; padding: 25px; border-radius: 12px; }
        h2 { color: #38bdf8; text-align: center; }
        label { display: block; margin: 15px 0 5px; }
        input, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; }
        button { background: #0284c7; font-weight: bold; margin-top: 20px; cursor: pointer; border: none; }
        button:hover { background: #0369a1; }
        .result-box { margin-top: 20px; background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #38bdf8; min-height: 150px; whitespace: pre-wrap; word-break: break-word; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎬 AI Video Movie Recap</h2>
    <p style="font-size: 13px; color: #94a3b8;">* သတိပေးချက် - Clip တိုတို (4MB အောက်) ဖိုင်များကိုသာ တင်ပေးပါ၊၊</p>
    
    <label>ဗီဒီယို ဖိုင် ရွေးပါ (Video Upload):</label>
    <input type="file" id="videoInput" accept="video/*">

    <button onclick="uploadAndGenerate()">Recap Script ထုတ်မည်</button>

    <label>AI သုံးသပ် ရေးသားထားသော မြန်မာ Script:</label>
    <div id="result" class="result-box">ဒီမှာ စာသား ပေါ်လာပါမည်...</div>
</div>

<script>
async function uploadAndGenerate() {
    const fileInput = document.getElementById('videoInput');
    const resultDiv = document.getElementById('result');

    if (!fileInput.files[0]) {
        alert("ကျေးဇူးပြု၍ ဗီဒီယိုဖိုင် ရွေးပါ");
        return;
    }

    const file = fileInput.files[0];

    // 4MB ထက်ကြီးရင် သတိပေးမည်
    if (file.size > 4.5 * 1024 * 1024) {
        alert("ဖိုင်ဆိုဒ် ကြီးလွန်းပါသည်။ 4MB အောက် clip တိုကိုသာ ရွေးပေးပါ၊၊");
        return;
    }

    const reader = new FileReader();
    resultDiv.innerText = "AI က ဗီဒီယိုကို ကြည့်ရှု သုံးသပ်နေပါသည်။ ခဏစောင့်ပါ...";

    reader.onload = async function () {
        const base64Data = reader.result.split(',')[1];
        
        try {
            const response = await fetch('/api/recap-video', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    videoBase64: base64Data,
                    mimeType: file.type 
                })
            });

            const data = await response.json();
            if (data.script) {
                resultDiv.innerText = data.script;
            } else {
                resultDiv.innerText = "အမှားအယွင်း: " + (data.error || "Script မထွက်ပါ။");
            }
        } catch (err) {
            resultDiv.innerText = "Server ချိတ်ဆက်မှု အဆင်မပြေပါ။";
        }
    };

    reader.readAsDataURL(file);
}
</script>

</body>
</html>
