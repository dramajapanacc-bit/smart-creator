<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YanNaing Free Ai Tool</title>

<style>
body{
    margin:0;
    padding:20px;
    min-height:100vh;
    font-family:Arial,"Noto Sans Myanmar",sans-serif;
    background:linear-gradient(135deg,#020617,#1e1b4b,#172554);
    color:white;
}

.box{
    max-width:650px;
    margin:auto;
    padding:25px;
    border-radius:22px;
    background:#0f172a;
    box-shadow:0 10px 40px #0008;
}

h1{
    text-align:center;
    font-size:28px;
    font-weight:900;
    background:linear-gradient(
        90deg,
        red,
        yellow,
        lime,
        cyan,
        blue,
        violet
    );
    -webkit-background-clip:text;
    color:transparent;
}

textarea{
    width:100%;
    height:220px;
    margin-top:15px;
    padding:15px;
    box-sizing:border-box;
    border-radius:14px;
    border:1px solid #475569;
    background:#020617;
    color:white;
    font-size:16px;
    line-height:1.8;
}

button{
    width:100%;
    margin-top:15px;
    padding:15px;
    border:0;
    border-radius:12px;
    color:white;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    font-size:17px;
    font-weight:bold;
}

.stop{
    background:linear-gradient(135deg,#dc2626,#be123c);
}

#status{
    margin-top:18px;
    padding:14px;
    text-align:center;
    border-radius:12px;
    background:#020617;
    color:#cbd5e1;
}
</style>
</head>

<body>

<div class="box">

<h1>✨ YanNaing Free Ai Tool ✨</h1>

<textarea
id="text"
maxlength="5000"
placeholder="မြန်မာစာထည့်ပါ..."
></textarea>

<button onclick="makeVoice()">
🎙️ မြန်မာအသံထုတ်မည်
</button>

<button class="stop" onclick="stopVoice()">
⏹️ ရပ်မည်
</button>

<div id="status">
အသင့်ဖြစ်ပါပြီ။
</div>

</div>

<script>

let audio = null;
let audioUrl = null;

async function makeVoice(){

    const text =
        document.getElementById("text")
        .value.trim();

    const status =
        document.getElementById("status");

    if(!text){

        alert("မြန်မာစာထည့်ပါ။");
        return;

    }

    stopVoice();

    status.innerText =
        "⏳ မြန်မာအသံထုတ်နေပါသည်...";

    try{

        const response =
            await fetch("/api/tts",{

                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:JSON.stringify({
                    text:text
                })

            });

        if(!response.ok){

            const data =
                await response.json()
                .catch(()=>({}));

            throw new Error(
                data.error ||
                "TTS Error"
            );

        }

        const blob =
            await response.blob();

        audioUrl =
            URL.createObjectURL(blob);

        audio =
            new Audio(audioUrl);

        /*
        Browser Speech API
        လုံးဝ မသုံးပါ။
        API ပြန်ပေးတဲ့ MP3
        တစ်ခုတည်းကိုသာ ဖွင့်ပါသည်။
        */

        audio.onended = function(){

            status.innerText =
                "✅ မြန်မာအသံပြီးပါပြီ။";

        };

        audio.onerror = function(){

            status.innerText =
                "❌ Audio ဖွင့်မရပါ။";

        };

        await audio.play();

        status.innerText =
            "🔊 မြန်မာအသံထွက်နေပါပြီ...";

    }
    catch(error){

        console.error(error);

        status.innerText =
            "❌ " + error.message;

    }

}

function stopVoice(){

    if(audio){

        audio.pause();
        audio.currentTime = 0;
        audio = null;

    }

    if(audioUrl){

        URL.revokeObjectURL(audioUrl);
        audioUrl = null;

    }

}

</script>

</body>
</html>
