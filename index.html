<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YanNaing Free Ai Tool</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 18px;
    min-height: 100vh;
    font-family: "Noto Sans Myanmar", Arial, sans-serif;
    background:
        radial-gradient(circle at top, #312e81, transparent 45%),
        linear-gradient(135deg, #020617, #111827, #1e1b4b);
    color: white;
}

.container {
    width: 100%;
    max-width: 680px;
    margin: auto;
    padding: 25px;
    border-radius: 24px;
    background: rgba(15, 23, 42, 0.94);
    border: 1px solid rgba(255,255,255,.15);
    box-shadow: 0 15px 50px rgba(0,0,0,.55);
}

/* ================= TITLE ================= */

.title {
    text-align: center;
    margin: 0;
    font-size: 30px;
    font-weight: 900;
    letter-spacing: .5px;

    background: linear-gradient(
        90deg,
        #ff0000,
        #ffea00,
        #00ff66,
        #00c8ff,
        #8b5cf6,
        #ff00aa
    );

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    text-shadow:
        0 0 12px rgba(56,189,248,.35);
}

.subtitle {
    text-align: center;
    margin: 8px 0 25px;
    color: #e2e8f0;
    font-size: 14px;
}

/* ================= LABEL ================= */

label {
    display: block;
    margin: 18px 0 8px;
    font-weight: bold;
    color: #fff;
}

/* ================= TEXTAREA ================= */

textarea {
    width: 100%;
    min-height: 220px;
    resize: vertical;

    padding: 15px;

    border-radius: 14px;
    border: 1px solid #475569;

    background: #020617;
    color: #fff;

    font-size: 16px;
    line-height: 1.8;

    outline: none;
}

textarea:focus {
    border-color: #38bdf8;
    box-shadow: 0 0 15px rgba(56,189,248,.25);
}

/* ================= COUNTER ================= */

.counter {
    text-align: right;
    margin-top: 6px;
    color: #94a3b8;
    font-size: 13px;
}

/* ================= VOICE ================= */

.voice-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.voice-card {
    padding: 17px;
    border-radius: 16px;

    background: #0f172a;
    border: 2px solid #334155;

    cursor: pointer;
    text-align: center;

    transition: .2s;
}

.voice-card:hover {
    transform: translateY(-2px);
    border-color: #38bdf8;
}

.voice-card.selected {
    border-color: #22c55e;
    background:
        linear-gradient(
            135deg,
            rgba(34,197,94,.15),
            rgba(59,130,246,.15)
        );

    box-shadow:
        0 0 18px rgba(34,197,94,.2);
}

.voice-icon {
    font-size: 30px;
}

.voice-name {
    margin-top: 6px;
    font-size: 18px;
    font-weight: bold;
}

.voice-type {
    margin-top: 4px;
    color: #94a3b8;
    font-size: 12px;
}

/* ================= CONTROLS ================= */

.control {
    margin-top: 22px;
}

.control-title {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
}

.value {
    color: #38bdf8;
    font-weight: bold;
}

input[type="range"] {
    width: 100%;
    accent-color: #38bdf8;
}

/* ================= BUTTON ================= */

button {
    width: 100%;
    border: none;
    border-radius: 13px;

    padding: 15px;
    margin-top: 20px;

    color: white;
    font-size: 17px;
    font-weight: bold;

    cursor: pointer;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );

    box-shadow:
        0 6px 20px rgba(37,99,235,.3);
}

button:active {
    transform: scale(.98);
}

.stop {
    background:
        linear-gradient(
            135deg,
            #dc2626,
            #be123c
        );
}

.clear {
    background:
        linear-gradient(
            135deg,
            #475569,
            #334155
        );
}

/* ================= STATUS ================= */

.status {
    margin-top: 20px;
    padding: 14px;

    text-align: center;

    border-radius: 12px;

    background: #020617;
    border: 1px solid #334155;

    color: #cbd5e1;

    line-height: 1.6;
}

/* ================= COLORS ================= */

.color-title {
    margin-top: 25px;
    text-align: center;
    font-weight: bold;

    background: linear-gradient(
        90deg,
        #ff0000,
        #ffff00,
        #00ff66,
        #00bfff,
        #a855f7
    );

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

/* ================= FOOTER ================= */

.footer {
    margin-top: 25px;
    text-align: center;
    font-size: 12px;
    color: #64748b;
}

/* ================= MOBILE ================= */

@media(max-width:480px) {

    .container {
        padding: 18px;
    }

    .title {
        font-size: 25px;
    }

    .voice-grid {
        grid-template-columns: 1fr 1fr;
    }

    textarea {
        min-height: 190px;
    }
}
</style>
</head>


<body>

<div class="container">

    <h1 class="title">
        ✨ YanNaing Free Ai Tool ✨
    </h1>

    <div class="subtitle">
        🇲🇲 Myanmar AI Voice Generator
    </div>


    <!-- TEXT -->

    <label>
        📝 မြန်မာစာ ထည့်ပါ
    </label>

    <textarea
        id="text"
        maxlength="5000"
        placeholder="ဒီနေရာမှာ မြန်မာစာ သို့မဟုတ် Movie Recap Script ထည့်ပါ..."
    ></textarea>

    <div class="counter">
        <span id="counter">0</span> / 5000
    </div>


    <!-- VOICE -->

    <label>
        🎙️ မြန်မာအသံ ရွေးပါ
    </label>

    <div class="voice-grid">

        <div
            class="voice-card selected"
            id="thihaCard"
            onclick="selectVoice('thiha')"
        >

            <div class="voice-icon">
                👨
            </div>

            <div class="voice-name">
                သီဟ
            </div>

            <div class="voice-type">
                🇲🇲 Male Voice
            </div>

        </div>


        <div
            class="voice-card"
            id="nilarCard"
            onclick="selectVoice('nilar')"
        >

            <div class="voice-icon">
                👩
            </div>

            <div class="voice-name">
                နီလာ
            </div>

            <div class="voice-type">
                🇲🇲 Female Voice
            </div>

        </div>

    </div>


    <!-- SPEED -->

    <div class="control">

        <div class="control-title">
            <span>⚡ အသံမြန်နှုန်း</span>

            <span
                class="value"
                id="speedValue"
            >
                1.0x
            </span>
        </div>

        <input
            type="range"
            id="speed"
            min="0.5"
            max="2"
            step="0.1"
            value="1"
        >

    </div>


    <!-- PITCH -->

    <div class="control">

        <div class="control-title">
            <span>🎚️ အသံအနိမ့် / အမြင့်</span>

            <span
                class="value"
                id="pitchValue"
            >
                0
            </span>
        </div>

        <input
            type="range"
            id="pitch"
            min="-10"
            max="10"
            step="1"
            value="0"
        >

    </div>


    <!-- VOLUME -->

    <div class="control">

        <div class="control-title">
            <span>🔊 Volume</span>

            <span
                class="value"
                id="volumeValue"
            >
                100%
            </span>
        </div>

        <input
            type="range"
            id="volume"
            min="0"
            max="100"
            value="100"
        >

    </div>


    <!-- BUTTONS -->

    <button onclick="generateVoice()">
        🎙️ အသံထုတ်မည်
    </button>


    <button
        class="stop"
        onclick="stopVoice()"
    >
        ⏹️ ရပ်မည်
    </button>


    <button
        class="clear"
        onclick="clearText()"
    >
        🗑️ ရှင်းမည်
    </button>


    <!-- STATUS -->

    <div
        class="status"
        id="status"
    >
        🎙️ သီဟ အသံရွေးထားပါသည်။
    </div>


    <div class="color-title">
        🌈 YanNaing Free Ai Tool 🌈
    </div>


    <div class="footer">
        Free Myanmar AI Voice Tool
    </div>

</div>


<script>

let selectedVoice = "thiha";


const text =
    document.getElementById("text");

const counter =
    document.getElementById("counter");

const speed =
    document.getElementById("speed");

const pitch =
    document.getElementById("pitch");

const volume =
    document.getElementById("volume");

const speedValue =
    document.getElementById("speedValue");

const pitchValue =
    document.getElementById("pitchValue");

const volumeValue =
    document.getElementById("volumeValue");

const status =
    document.getElementById("status");


/* =========================
   CHARACTER COUNTER
========================= */

text.addEventListener(
    "input",
    function(){

        counter.textContent =
            this.value.length;

    }
);


/* =========================
   VOICE SELECT
========================= */

function selectVoice(voice){

    selectedVoice =
        voice;


    document
        .getElementById("thihaCard")
        .classList
        .remove("selected");


    document
        .getElementById("nilarCard")
        .classList
        .remove("selected");


    if(voice === "thiha"){

        document
            .getElementById("thihaCard")
            .classList
            .add("selected");

        status.textContent =
            "👨 သီဟ — Male Voice ရွေးထားပါသည်။";

    }


    if(voice === "nilar"){

        document
            .getElementById("nilarCard")
            .classList
            .add("selected");

        status.textContent =
            "👩 နီလာ — Female Voice ရွေးထားပါသည်။";

    }

}


/* =========================
   SLIDERS
========================= */

speed.addEventListener(
    "input",
    function(){

        speedValue.textContent =
            this.value + "x";

    }
);


pitch.addEventListener(
    "input",
    function(){

        pitchValue.textContent =
            this.value;

    }
);


volume.addEventListener(
    "input",
    function(){

        volumeValue.textContent =
            this.value + "%";

    }
);


/* =========================
   GENERATE VOICE
========================= */

async function generateVoice(){

    const value =
        text.value.trim();


    if(!value){

        alert(
            "ကျေးဇူးပြု၍ မြန်မာစာထည့်ပါ။"
        );

        return;

    }


    status.textContent =
        "⏳ " +
        (
            selectedVoice === "thiha"
            ? "သီဟ"
            : "နီလာ"
        ) +
        " အသံထုတ်နေပါသည်...";


    try{

        const response =
            await fetch(
                "/api/tts",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        text:value,

                        voice:selectedVoice,

                        speed:
                            parseFloat(
                                speed.value
                            ),

                        pitch:
                            parseInt(
                                pitch.value
                            ),

                        volume:
                            parseInt(
                                volume.value
                            )

                    })
                }
            );


        if(!response.ok){

            let error =
                "Voice ထုတ်မရပါ။";

            try{

                const data =
                    await response.json();

                if(data.error){

                    error =
                        data.error;

                }

            }catch(e){}

            throw new Error(error);

        }


        const blob =
            await response.blob();


        const audioUrl =
            URL.createObjectURL(blob);


        const audio =
            new Audio(audioUrl);


        audio.volume =
            parseInt(volume.value) / 100;


        audio.play();


        status.textContent =
            "✅ " +
            (
                selectedVoice === "thiha"
                ? "သီဟ"
                : "နီလာ"
            ) +
            " အသံထွက်နေပါပြီ။";


    }catch(error){

        console.error(error);

        status.textContent =
            "❌ " +
            error.message;

    }

}


/* =========================
   STOP
========================= */

function stopVoice(){

    window.speechSynthesis.cancel();

    status.textContent =
        "⏹️ အသံရပ်လိုက်ပါပြီ။";

}


/* =========================
   CLEAR
========================= */

function clearText(){

    stopVoice();

    text.value = "";

    counter.textContent =
        "0";

    status.textContent =
        "📝 စာသားရှင်းပြီးပါပြီ။";

}

</script>

</body>
</html>
