<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YanNaing AI Voice</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #0f172a);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(30, 41, 59, 0.95);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,.5);
            border: 1px solid rgba(56,189,248,.3);
            box-sizing: border-box;
        }

        h2 {
            color: #38bdf8;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #cbd5e1;
            font-size: 13px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 8px;
            font-weight: 600;
            color: #e2e8f0;
        }

        textarea {
            width: 100%;
            min-height: 220px;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 8px rgba(56,189,248,.4);
        }

        button {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            background: linear-gradient(135deg,#0284c7,#2563eb);
            color: white;
            font-weight: bold;
            font-size: 16px;
            margin-top: 20px;
            cursor: pointer;
            border: none;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        audio {
            width: 100%;
            margin-top: 20px;
        }

        #status {
            margin-top: 15px;
            text-align: center;
            color: #cbd5e1;
            font-size: 14px;
        }

        .download {
            display: block;
            text-align: center;
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            background: #16a34a;
            color: white;
            text-decoration: none;
            font-weight: bold;
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>🎙️ YanNaing AI Voice</h2>

    <div class="subtitle">
        မြန်မာစာကို မြန်မာ AI Voice အဖြစ် ပြောင်းပါ
    </div>

    <label>📝 မြန်မာစာ ထည့်ပါ</label>

    <textarea
        id="textInput"
        placeholder="ဥပမာ - ဒီနေ့မှာတော့ စိတ်ဝင်စားစရာကောင်းတဲ့ ရုပ်ရှင်တစ်ကားအကြောင်း ပြောပြပေးသွားမှာ ဖြစ်ပါတယ်..."
    ></textarea>

    <button id="voiceButton" onclick="generateVoice()">
        🎙️ မြန်မာအသံ ထုတ်မည်
    </button>

    <div id="status"></div>

    <audio id="audioPlayer" controls></audio>

    <a id="downloadButton" class="download" download="myanmar-voice.mp3">
        ⬇️ အသံဖိုင် Download လုပ်မည်
    </a>

</div>

<script>

async function generateVoice() {

    const text = document.getElementById('textInput').value.trim();
    const button = document.getElementById('voiceButton');
    const status = document.getElementById('status');
    const audio = document.getElementById('audioPlayer');
    const download = document.getElementById('downloadButton');

    if (!text) {
        alert("မြန်မာစာ အရင်ထည့်ပေးပါ။");
        return;
    }

    button.disabled = true;
    button.innerText = "⏳ အသံထုတ်နေပါပြီ...";
    status.innerText = "🎙️ မြန်မာအသံ ပြောင်းနေပါသည်...";
    download.style.display = "none";

    try {

        const response = await fetch('/api/tts', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                text: text
            })
        });

        if (!response.ok) {

            let errorMessage = "အသံထုတ်မရပါ။";

            try {
                const errorData = await response.json();

                if (errorData.error) {
                    errorMessage = errorData.error;
                }

            } catch (e) {}

            throw new Error(errorMessage);
        }

        const audioBlob = await response.blob();

        if (!audioBlob.size) {
            throw new Error("Audio file အလွတ်ဖြစ်နေပါသည်။");
        }

        const audioUrl = URL.createObjectURL(audioBlob);

        audio.src = audioUrl;
        audio.style.display = "block";

        download.href = audioUrl;
        download.style.display = "block";

        status.innerText = "✅ အသံထုတ်ပြီးပါပြီ။";

        await audio.play();

    } catch (error) {

        console.error(error);

        status.innerText =
            "❌ " + (error.message || "အသံထုတ်ရာတွင် အမှားဖြစ်နေပါသည်။");

    } finally {

        button.disabled = false;
        button.innerText = "🎙️ မြန်မာအသံ ထုတ်မည်";
    }
}

</script>

</body>
</html>
