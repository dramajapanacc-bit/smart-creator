<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YanNaing AI Voice</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    min-height:100vh;
    font-family:Arial,"Noto Sans Myanmar",sans-serif;
    background:linear-gradient(135deg,#07111f,#111b3d,#07111f);
    color:white;
}

.container{
    width:100%;
    max-width:650px;
    margin:auto;
    background:rgba(25,35,55,.95);
    border:1px solid #249eea;
    border-radius:20px;
    padding:25px;
    box-shadow:0 10px 40px rgba(0,0,0,.5);
}

h1{
    text-align:center;
    color:#38bdf8;
    margin:5px 0 8px;
}

.subtitle{
    text-align:center;
    color:#cbd5e1;
    margin-bottom:25px;
}

label{
    display:block;
    margin:18px 0 8px;
    font-weight:bold;
}

textarea,
select{
    width:100%;
    background:#0b1427;
    color:white;
    border:1px solid #475569;
    border-radius:12px;
    padding:14px;
    font-size:16px;
}

textarea{
    min-height:180px;
    resize:vertical;
}

select{
    height:50px;
}

.control{
    margin-top:20px;
}

.control-title{
    display:flex;
    justify-content:space-between;
    margin-bottom:8px;
}

input[type="range"]{
    width:100%;
    accent-color:#38bdf8;
}

button{
    width:100%;
    padding:15px;
    margin-top:20px;
    border:0;
    border-radius:12px;
    color:white;
    font-size:17px;
    font-weight:bold;
    background:linear-gradient(135deg,#0284c7,#2563eb);
}

button:active{
    transform:scale(.98);
}

.secondary{
    background:#334155;
}

.status{
    margin-top:18px;
    padding:14px;
    border-radius:10px;
    background:#0b1427;
    color:#cbd5e1;
    text-align:center;
    min-height:45px;
}
</style>
</head>

<body>

<div class="container">

    <h1>✨ YanNaing AI Voice</h1>

    <div class="subtitle">
        မြန်မာစာကို အသံအဖြစ် ပြောင်းပေးမည့် Free Voice Tool
    </div>

    <label>📝 စာသားထည့်ပါ</label>

    <textarea id="text"
        placeholder="ဒီနေရာမှာ မြန်မာ Script ထည့်ပါ..."></textarea>


    <label>🎙️ အသံရွေးပါ</label>

    <select id="voice">
        <option value="">အသံများ ရှာနေပါသည်...</option>
    </select>


    <div class="control">

        <div class="control-title">
            <span>🎚️ Pitch</span>
            <span id="pitchValue">1.0</span>
        </div>

        <input
            type="range"
            id="pitch"
            min="0.5"
            max="2"
            step="0.1"
            value="1"
        >

    </div>


    <div class="control">

        <div class="control-title">
            <span>⚡ Speed</span>
            <span id="speedValue">1.0</span>
        </div>

        <input
            type="range"
            id="speed"
            min="0.5"
            max="2"
            step="0.1"
            value="1"
        >

    </div>


    <div class="control">

        <div class="control-title">
            <span>🔊 Volume</span>
            <span id="volumeValue">1.0</span>
        </div>

        <input
            type="range"
            id="volume"
            min="0"
            max="1"
            step="0.1"
            value="1"
        >

    </div>


    <button onclick="speakText()">
        ▶️ အသံထွက်မည်
    </button>

    <button class="secondary" onclick="stopVoice()">
        ⏹️ ရပ်မည်
    </button>


    <div id="status" class="status">
        အသံရွေးရန် အသင့်ဖြစ်ပါပြီ။
    </div>

</div>


<script>

const voiceSelect = document.getElementById("voice");
const textInput = document.getElementById("text");

const pitch = document.getElementById("pitch");
const speed = document.getElementById("speed");
const volume = document.getElementById("volume");

const pitchValue = document.getElementById("pitchValue");
const speedValue = document.getElementById("speedValue");
const volumeValue = document.getElementById("volumeValue");

const statusBox = document.getElementById("status");

let voices = [];


function loadVoices(){

    voices = speechSynthesis.getVoices();

    voiceSelect.innerHTML = "";

    if(voices.length === 0){

        const option = document.createElement("option");

        option.textContent = "အသံများ မတွေ့သေးပါ";

        voiceSelect.appendChild(option);

        return;
    }

    voices.forEach((voice,index)=>{

        const option = document.createElement("option");

        option.value = index;

        option.textContent =
            voice.name +
            " (" +
            voice.lang +
            ")";

        voiceSelect.appendChild(option);

    });

    statusBox.textContent =
        voices.length +
        " အသံ ရှာတွေ့ပါပြီ။";

}


speechSynthesis.onvoiceschanged = loadVoices;

loadVoices();


function speakText(){

    const text = textInput.value.trim();

    if(!text){

        alert("ကျေးဇူးပြု၍ စာသားထည့်ပါ။");

        return;
    }

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);


    const selectedIndex =
        parseInt(voiceSelect.value);

    if(
        !isNaN(selectedIndex) &&
        voices[selectedIndex]
    ){

        utterance.voice =
            voices[selectedIndex];

        utterance.lang =
            voices[selectedIndex].lang;

    }


    utterance.pitch =
        parseFloat(pitch.value);

    utterance.rate =
        parseFloat(speed.value);

    utterance.volume =
        parseFloat(volume.value);


    utterance.onstart = function(){

        statusBox.textContent =
            "🔊 အသံထွက်နေပါပြီ...";

    };


    utterance.onend = function(){

        statusBox.textContent =
            "✅ အသံပြီးပါပြီ။";

    };


    utterance.onerror = function(){

        statusBox.textContent =
            "❌ အသံထွက်ရာတွင် အမှားရှိပါသည်။";

    };


    speechSynthesis.speak(utterance);

}


function stopVoice(){

    speechSynthesis.cancel();

    statusBox.textContent =
        "⏹️ အသံရပ်လိုက်ပါပြီ။";

}


pitch.oninput = function(){

    pitchValue.textContent =
        this.value;

};


speed.oninput = function(){

    speedValue.textContent =
        this.value;

};


volume.oninput = function(){

    volumeValue.textContent =
        this.value;

};

</script>

</body>
</html>
